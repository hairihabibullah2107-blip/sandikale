name: Build and deploy SANDIKALE to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    defaults:
      run:
        working-directory: sandikale-kasir-repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test synchronization logic
        run: npm run test:sync

      - name: Validate Supabase configuration
        run: |
          if [ "$VITE_SUPABASE_URL" != "https://jkiuvpcicgjzcifxqfvp.supabase.co" ]; then
            echo "::error::VITE_SUPABASE_URL kosong atau bukan URL project SANDIKALE yang benar."
            exit 1
          fi
          case "$VITE_SUPABASE_ANON_KEY" in
            sb_publishable_*) ;;
            *) echo "::error::VITE_SUPABASE_ANON_KEY tidak berisi Supabase Publishable Key (sb_publishable_...)."; exit 1 ;;
          esac
          echo "Konfigurasi Supabase valid: URL cocok dan Publishable Key terisi."
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build application
        run: npm run build
        env:
          VITE_BASE: /sandikale/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: sandikale-kasir-repo/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
